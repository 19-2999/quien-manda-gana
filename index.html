<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<title>Quien gana, manda</title>
<style>
:root{--b1:#ff4fa3;--b2:#8b3dff;--b3:#2f5bff;--sf:#ffffff;--tx:#2a0f5e;--mu:#7a5fb8;--ln:#e5dcff;--ok:#12b76a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#c2186a;--b2:#4b1fa8;--b3:#1a1050;--sf:#2b1b66;--tx:#f4efff;--mu:#b9a6f0;--ln:#473190;color-scheme:dark}}
:root[data-theme="dark"]{--b1:#c2186a;--b2:#4b1fa8;--b3:#1a1050;--sf:#2b1b66;--tx:#f4efff;--mu:#b9a6f0;--ln:#473190;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:700 16px/1.4 Nunito,"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.5px) 0 0/26px 26px,linear-gradient(165deg,var(--b1),var(--b2) 55%,var(--b3));background-attachment:fixed}
.w{max-width:560px;margin:0 auto;padding:10px 14px 36px;text-align:center}
h1,h2,button,.bn{font-family:"Lilita One","Trebuchet MS",system-ui,sans-serif;font-weight:400}
h1{font-size:clamp(34px,9.5vw,54px);line-height:1;margin:10px 0 4px;color:#fff;text-shadow:0 3px 0 #ff9f1c,0 7px 0 rgba(0,0,0,.25);letter-spacing:.5px}
h2{margin:0 0 6px;font-size:26px}
.sub{color:rgba(255,255,255,.9);margin:0 0 10px;font-size:15px}
#sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0}
.pl{background:var(--sf);color:var(--tx);border-radius:16px;border-top:7px solid var(--c);padding:6px 8px 8px;box-shadow:0 4px 0 rgba(0,0,0,.22);transition:transform .2s}
.pl.on{transform:scale(1.05);box-shadow:0 0 0 3px #ffe14d,0 8px 18px rgba(0,0,0,.35)}
.pl b{display:block;font-size:14px}.pl small{display:block;color:var(--mu);font-size:11px}
.pl span{display:block;font:400 54px/1 "Lilita One",system-ui,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.pl em{font:800 14px Nunito,system-ui,sans-serif;font-style:normal;color:var(--mu);margin-left:3px}
.bar{height:8px;background:var(--ln);border-radius:5px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--c);transition:width .5s}
.wh{position:relative;width:min(88vw,380px);margin:26px auto 18px;padding:14px;border-radius:50%;background:conic-gradient(#ffe14d,#ff9f1c,#ffe14d,#ff9f1c,#ffe14d);box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.7)}
.wh::after{content:"";position:absolute;inset:2px;border-radius:50%;background:repeating-conic-gradient(#fff 0 3deg,transparent 3deg 10deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px));mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px));pointer-events:none;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.3}}
#wl{width:100%;display:block;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,.85);transition:transform 4s cubic-bezier(.12,.7,.1,1)}
#wl text{font-family:"Lilita One","Trebuchet MS",system-ui,sans-serif}
.pt{position:absolute;left:50%;top:-20px;transform:translateX(-50%);border:17px solid transparent;border-top:38px solid #fff;border-bottom:0;z-index:3;filter:drop-shadow(0 4px 0 #ff2e88)}
#gm{background:var(--sf);color:var(--tx);border-radius:22px;padding:16px;min-height:120px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
#gm.fg{position:fixed;inset:0;z-index:20;overflow:auto;border-radius:0;box-shadow:none;color:#fff;background:radial-gradient(rgba(255,255,255,.16) 2px,transparent 2.5px) 0 0/26px 26px,linear-gradient(165deg,var(--b1),var(--b2) 55%,var(--b3));padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,calc(50vw - 260px)) calc(env(safe-area-inset-bottom,0px) + 120px);animation:pop .35s}
#gm.fg h2{color:#ffe14d;text-shadow:0 2px 0 rgba(0,0,0,.3)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.bn{font-size:clamp(90px,26vw,130px);line-height:1;color:#ffe14d;text-shadow:0 5px 0 #ff2e88,0 10px 0 rgba(0,0,0,.25);animation:pul 1.2s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.07)}}
button{font-size:18px;line-height:1;border:0;background:#fff;color:#2a0f5e;border-radius:999px;padding:14px 22px;margin:5px;cursor:pointer;min-height:48px;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .08s,box-shadow .08s}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
button:focus-visible{outline:3px solid #ffe14d;outline-offset:3px}
button.pr{background:linear-gradient(180deg,#ffe14d,#ff9f1c);color:#4a1700;box-shadow:0 5px 0 #b45f00}
button.gb{font-size:30px;padding:18px 36px}
.ad{font-size:13px;padding:6px 12px;min-height:30px;margin:2px;background:var(--ln);color:var(--tx);box-shadow:none}
.q{font-size:clamp(20px,5.4vw,26px);font-weight:800;margin:10px 0;text-align:left;line-height:1.3}
.op2{background:rgba(255,255,255,.16);border-radius:14px;padding:10px 14px;margin:7px 0;text-align:left;font-weight:800}
.an{background:var(--ok);color:#fff;border-radius:14px;padding:12px;margin:10px 0;font-size:20px;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.cd{display:inline-block;min-width:70px;padding:14px 12px;margin:6px;background:#fff;color:#2a0f5e;border:4px solid #ffe14d;border-radius:14px;font:400 36px/1 "Lilita One",system-ui,sans-serif}
.res{margin:14px 0 4px;font:400 26px/1.2 "Lilita One",system-ui,sans-serif;color:#ffe14d}
.st{padding:20px 0}
input{font:700 16px Nunito,system-ui,sans-serif;padding:12px;border:2px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--tx);min-height:46px}
.fm{background:var(--sf);color:var(--tx);border-radius:18px;padding:12px;margin:12px 0;box-shadow:0 5px 0 rgba(0,0,0,.25);text-align:left}
.fm input{width:100%;margin-bottom:8px}
#adj{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 16px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:rgba(20,8,60,.94);color:#fff;font-size:14px}
#adj b{color:#ffe14d;font-size:22px;margin:0 2px}
#sp{position:fixed;inset:0;z-index:100;background:#fcdccd;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;animation:spo .7s 2.8s forwards}
#sp img{width:min(78vw,380px);height:auto;animation:spi 1s ease-out}
#sp small{color:#a0634a;margin-top:6px;font:700 13px Nunito,system-ui,sans-serif;letter-spacing:.5px}
@keyframes spi{from{opacity:0;transform:scale(.88)}}
@keyframes spo{to{opacity:0;visibility:hidden}}
.mini{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:42px;height:42px;z-index:5;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.mg{transform-origin:50px 50px;animation:mr 14s linear infinite}
@keyframes mr{to{transform:rotate(360deg)}}
